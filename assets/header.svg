<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="900" height="200" rx="18" fill="#0b0f1a"/>
  <ellipse cx="180" cy="40" rx="180" ry="90" fill="#7c3aed" opacity="0.28" filter="url(#soft)"/>
  <ellipse cx="740" cy="170" rx="200" ry="90" fill="#06b6d4" opacity="0.25" filter="url(#soft)"/>
  <ellipse cx="470" cy="110" rx="140" ry="70" fill="#3b82f6" opacity="0.16" filter="url(#soft)"/>

  <g opacity="0.35" stroke="url(#g2)" stroke-width="1" fill="none">
    <path d="M40 150 C 160 90, 240 190, 360 130 S 560 70, 700 120 S 840 160, 870 120" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="160" to="0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#a5b4fc" opacity="0.9">
    <circle cx="70" cy="60" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="55" r="3"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="38" r="2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="165" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="172" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <text x="450" y="88" text-anchor="middle" font-size="46" font-weight="800" fill="url(#g)" filter="url(#glow)" letter-spacing="1">
    SAPTARSHI MUKHERJEE
  </text>
  <text x="450" y="128" text-anchor="middle" font-size="19" fill="#cbd5e1" letter-spacing="6" font-weight="500">
    DEVELOPER · BUILDER · CREATOR
  </text>
  <g transform="translate(450,158)">
    <rect x="-150" y="-11" width="300" height="22" rx="11" fill="none" stroke="url(#g2)" stroke-width="1.5" opacity="0.8"/>
    <text y="5" text-anchor="middle" font-size="13" fill="#94a3b8" letter-spacing="3" font-family="monospace">
      &lt; code · design · ship /&gt;
    </text>
  </g>
</svg>
