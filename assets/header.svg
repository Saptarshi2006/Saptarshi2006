<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>

    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="topFace2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="nameTop" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.02"/>
    </linearGradient>

    <radialGradient id="glowPool" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="haze" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="tinyGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="drop" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- extruded name: single text used many times -->
    <text id="nameGlyph" x="0" y="0" font-size="72" font-weight="800"
          letter-spacing="6" text-anchor="middle">SAPTARSHI</text>
    <text id="subGlyph" x="0" y="0" font-size="30" font-weight="700"
          letter-spacing="14" text-anchor="middle">MUKHERJEE</text>

    <clipPath id="floorClip"><rect x="0" y="176" width="980" height="184"/></clipPath>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="980" height="360" fill="url(#bg)"/>
  <ellipse cx="490" cy="300" rx="430" ry="120" fill="url(#glowPool)"/>
  <ellipse cx="720" cy="80" rx="260" ry="130" fill="url(#haze)"/>
  <ellipse cx="180" cy="110" rx="200" ry="110" fill="url(#haze)" opacity="0.7"/>

  <!-- ================= ISOMETRIC GRID FLOOR ================= -->
  <g clip-path="url(#floorClip)" stroke="url(#floorFade)" stroke-width="1.1" fill="none">
    <!-- lines running down-right (+30°) -->
    <g opacity="0.75">
      <path d="M-60 176 L 460 476"/><path d="M20 176 L 540 476"/>
      <path d="M100 176 L 620 476"/><path d="M180 176 L 700 476"/>
      <path d="M260 176 L 780 476"/><path d="M340 176 L 860 476"/>
      <path d="M420 176 L 940 476"/><path d="M500 176 L 1020 476"/>
      <path d="M580 176 L 1100 476"/><path d="M660 176 L 1180 476"/>
      <path d="M740 176 L 1260 476"/><path d="M820 176 L 1340 476"/>
      <path d="M900 176 L 1420 476"/><path d="M980 176 L 1500 476"/>
    </g>
    <!-- lines running down-left (−30°) -->
    <g opacity="0.75">
      <path d="M-60 476 L 460 176"/><path d="M20 476 L 540 176"/>
      <path d="M100 476 L 620 176"/><path d="M180 476 L 700 176"/>
      <path d="M260 476 L 780 176"/><path d="M340 476 L 860 176"/>
      <path d="M420 476 L 940 176"/><path d="M500 476 L 1020 176"/>
      <path d="M580 476 L 1100 176"/><path d="M660 476 L 1180 176"/>
      <path d="M740 476 L 1260 176"/><path d="M820 476 L 1340 176"/>
      <path d="M900 476 L 1420 176"/><path d="M980 476 L 1500 176"/>
    </g>
  </g>
  <!-- horizon glow line -->
  <rect x="0" y="175" width="980" height="1.6" fill="#22d3ee" opacity="0.5" filter="url(#tinyGlow)"/>

  <!-- ================= FLOATING CUBES ================= -->
  <!-- cube template: 64px, drawn centered at 0,0 then placed -->

  <!-- cube 1: { } top-left -->
  <g transform="translate(140,86)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -10; 0 0" dur="3.2s" repeatCount="indefinite"/>
      <g filter="url(#drop)">
        <!-- left face -->
        <polygon points="-32,0 -32,36 0,54 0,18" fill="#312e81"/>
        <!-- right face -->
        <polygon points="0,18 0,54 32,36 32,0" fill="#1e1b4b"/>
        <!-- top face -->
        <polygon points="0,-18 32,0 0,18 -32,0" fill="url(#topFace)"/>
        <!-- glyph -->
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="700"
              fill="#0d1117" transform="skewX(-30) translate(9,0)">{ }</text>
      </g>
      <!-- shadow on floor -->
      <ellipse cx="10" cy="150" rx="26" ry="9" fill="#22d3ee" opacity="0.14">
        <animate attributeName="rx" values="26;20;26" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.07;0.16" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- cube 2: </> upper-right -->
  <g transform="translate(830,74)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -13; 0 0" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
      <g filter="url(#drop)">
        <polygon points="-38,0 -38,42 0,64 0,22" fill="#312e81"/>
        <polygon points="0,22 0,64 38,42 38,0" fill="#1e1b4b"/>
        <polygon points="0,-22 38,0 0,22 -38,0" fill="url(#topFace2)"/>
        <text x="0" y="7" text-anchor="middle" font-size="13" font-weight="700"
              fill="#0d1117" transform="skewX(-30) translate(11,0)">&lt;/&gt;</text>
      </g>
      <ellipse cx="12" cy="170" rx="30" ry="10" fill="#22d3ee" opacity="0.14">
        <animate attributeName="rx" values="30;23;30" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.16;0.07;0.16" dur="3.8s" begin="0.6s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- cube 3: [] mid-left, smaller -->
  <g transform="translate(210,150) scale(0.72)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -9; 0 0" dur="2.7s" begin="1.1s" repeatCount="indefinite"/>
      <g filter="url(#drop)">
        <polygon points="-32,0 -32,36 0,54 0,18" fill="#312e81"/>
        <polygon points="0,18 0,54 32,36 32,0" fill="#1e1b4b"/>
        <polygon points="0,-18 32,0 0,18 -32,0" fill="url(#topFace)"/>
        <text x="0" y="6" text-anchor="middle" font-size="16" font-weight="700"
              fill="#0d1117" transform="skewX(-30) translate(9,0)">[ ]</text>
      </g>
      <ellipse cx="10" cy="150" rx="24" ry="8" fill="#7c3aed" opacity="0.15">
        <animate attributeName="rx" values="24;18;24" dur="2.7s" begin="1.1s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- cube 4: rs (rust) mid-right, smaller -->
  <g transform="translate(760,148) scale(0.78)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -11; 0 0" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      <g filter="url(#drop)">
        <polygon points="-32,0 -32,36 0,54 0,18" fill="#312e81"/>
        <polygon points="0,18 0,54 32,36 32,0" fill="#1e1b4b"/>
        <polygon points="0,-18 32,0 0,18 -32,0" fill="url(#topFace2)"/>
        <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800"
              fill="#0d1117" transform="skewX(-30) translate(9,0)">rs</text>
      </g>
      <ellipse cx="10" cy="150" rx="24" ry="8" fill="#22d3ee" opacity="0.14">
        <animate attributeName="rx" values="24;18;24" dur="3.4s" begin="1.7s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- cube 5: py, far small, high -->
  <g transform="translate(640,58) scale(0.58)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -8; 0 0" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
      <g filter="url(#drop)">
        <polygon points="-32,0 -32,36 0,54 0,18" fill="#312e81"/>
        <polygon points="0,18 0,54 32,36 32,0" fill="#1e1b4b"/>
        <polygon points="0,-18 32,0 0,18 -32,0" fill="url(#topFace)"/>
        <text x="0" y="6" text-anchor="middle" font-size="17" font-weight="800"
              fill="#0d1117" transform="skewX(-30) translate(9,0)">py</text>
      </g>
      <ellipse cx="10" cy="150" rx="22" ry="7" fill="#7c3aed" opacity="0.13">
        <animate attributeName="rx" values="22;17;22" dur="2.9s" begin="0.3s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>

  <!-- ================= EXTRUDED NAME ================= -->
  <g transform="translate(490,196)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 0 -4; 0 0" dur="5s" repeatCount="indefinite"/>

      <!-- contact shadow on floor -->
      <ellipse cx="6" cy="86" rx="250" ry="26" fill="#000" opacity="0.5" filter="url(#softGlow)"/>
      <ellipse cx="0" cy="80" rx="190" ry="16" fill="#7c3aed" opacity="0.28"/>

      <!-- extrusion layers: back → front (down-right along isometric light) -->
      <g fill="#0f131a">
        <use href="#nameGlyph" x="14" y="14"/><use href="#nameGlyph" x="13" y="13"/>
        <use href="#nameGlyph" x="12" y="12"/><use href="#nameGlyph" x="11" y="11"/>
        <use href="#nameGlyph" x="10" y="10"/><use href="#nameGlyph" x="9" y="9"/>
        <use href="#nameGlyph" x="8" y="8"/><use href="#nameGlyph" x="7" y="7"/>
      </g>
      <g fill="#161d29">
        <use href="#nameGlyph" x="6" y="6"/><use href="#nameGlyph" x="5" y="5"/>
        <use href="#nameGlyph" x="4" y="4"/><use href="#nameGlyph" x="3" y="3"/>
      </g>
      <g fill="#1f2937">
        <use href="#nameGlyph" x="2" y="2"/><use href="#nameGlyph" x="1" y="1"/>
      </g>

      <!-- top face -->
      <use href="#nameGlyph" fill="url(#nameTop)" stroke="#e9d5ff"
           stroke-width="1.1" stroke-opacity="0.55" filter="url(#softGlow)"/>

      <!-- ============ extruded subtitle slab ============ -->
      <g transform="translate(0,84)">
        <!-- isometric slab (thin box) -->
        <g filter="url(#drop)">
          <polygon points="-212,0 -212,14 -150,44 -150,30" fill="#312e81" transform="translate(0,10)"/>
          <polygon points="212,0 212,14 150,44 150,30" fill="#1e1b4b" transform="translate(0,10)"/>
          <!-- top plate -->
          <polygon points="0,-24 212,10 0,44 -212,10" fill="#171d2a" stroke="#22d3ee"
                   stroke-opacity="0.45" stroke-width="1.2"/>
          <!-- side skirt -->
          <polygon points="-212,10 0,44 0,54 -212,20" fill="#10141c"/>
          <polygon points="212,10 0,44 0,54 212,20" fill="#0c1017"/>
        </g>
        <!-- subtitle text on the plate (skewed to sit on the isometric plane) -->
        <g transform="translate(0,14) skewX(-0)">
          <use href="#subGlyph" fill="#22d3ee" filter="url(#tinyGlow)"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= ATMOSPHERE PARTICLES ================= -->
  <g fill="#a5b4fc">
    <circle cx="90" cy="230" r="2.2" opacity="0.8" filter="url(#tinyGlow)">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="210" r="2.6" opacity="0.7" filter="url(#tinyGlow)">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="52" r="1.8" opacity="0.6">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="40" r="2" opacity="0.55">
      <animate attributeName="opacity" values="0.7;0.15;0.7" dur="3.2s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="875" cy="300" r="2.2" opacity="0.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.15;0.7;0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="320" r="2" opacity="0.5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- top accent bar -->
  <rect x="0" y="0" width="980" height="2.5" fill="url(#topFace)" opacity="0.9"/>
</svg>
