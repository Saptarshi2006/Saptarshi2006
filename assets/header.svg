<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" font-family="'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c212b"/>
      <stop offset="100%" stop-color="#171b24"/>
    </linearGradient>
    <radialGradient id="orbV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#8b949e" opacity="0.07"/>
    </pattern>
    <filter id="winShadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowTxt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="win"><rect x="14" y="14" width="952" height="392" rx="16"/></clipPath>
  </defs>

  <!-- backdrop -->
  <rect width="980" height="420" fill="url(#pageBg)"/>

  <g filter="url(#winShadow)">
    <rect x="14" y="14" width="952" height="392" rx="16" fill="#0d1117" stroke="#2d3340" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#win)">
    <!-- ===== page content background ===== -->
    <rect x="14" y="62" width="952" height="344" fill="url(#pageBg)"/>
    <rect x="14" y="62" width="952" height="344" fill="url(#dots)"/>
    <ellipse cx="150" cy="130" rx="240" ry="160" fill="url(#orbV)"/>
    <ellipse cx="880" cy="380" rx="260" ry="150" fill="url(#orbC)"/>

    <!-- ===== browser chrome ===== -->
    <rect x="14" y="14" width="952" height="48" fill="url(#chrome)"/>
    <rect x="14" y="44" width="952" height="18" fill="#171b24"/>
    <line x1="14" y1="62" x2="966" y2="62" stroke="#2d3340" stroke-width="1.2"/>

    <circle cx="44" cy="38" r="6.5" fill="#ff5f57"/>
    <circle cx="66" cy="38" r="6.5" fill="#febc2e"/>
    <circle cx="88" cy="38" r="6.5" fill="#28c840"/>

    <!-- nav arrows -->
    <text x="118" y="43" font-size="15" fill="#596375">‹</text>
    <text x="140" y="43" font-size="15" fill="#596375">›</text>

    <!-- URL bar -->
    <rect x="330" y="24" width="340" height="28" rx="14" fill="#10151c" stroke="#2d3340"/>
    <g transform="translate(348,31)">
      <rect x="0" y="4.5" width="9" height="7" rx="1.6" fill="#3fb950"/>
      <path d="M1.8 4.5 V2.8 a2.7 2.7 0 0 1 5.4 0 V4.5" stroke="#3fb950" stroke-width="1.5" fill="none"/>
    </g>
    <text x="368" y="43" font-size="13" fill="#8b949e">saptarshi2006.github.io</text>
    <text x="648" y="43" font-size="13" fill="#596375">☆</text>

    <!-- right chrome icons -->
    <g fill="#596375"><circle cx="920" cy="38" r="2"/><circle cx="930" cy="38" r="2"/><circle cx="940" cy="38" r="2"/></g>

    <!-- accent hairline -->
    <rect x="14" y="62" width="952" height="2" fill="url(#topLine)" opacity="0.85"/>

    <!-- ============ LEFT · HERO ============ -->
    <!-- availability pill -->
    <rect x="60" y="96" width="216" height="30" rx="15" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.45"/>
    <circle cx="80" cy="111" r="4.5" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="115" font-size="11.5" fill="#3fb950" letter-spacing="1.6">AVAILABLE FOR PROJECTS</text>

    <!-- greeting -->
    <text x="60" y="164" font-size="17" fill="#7d8590" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Hi, I'm</text>

    <!-- name -->
    <text x="60" y="216" font-size="46" font-weight="800" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
          fill="url(#nameGrad)" letter-spacing="0.5" filter="url(#glowTxt)">Saptarshi Mukherjee</text>

    <!-- typing role lines (rotating) -->
    <g font-size="19" fill="#22d3ee" font-weight="600">
      <text x="60" y="256">Full-stack Developer
        <animate attributeName="opacity" calcMode="discrete" values="1;0;0" keyTimes="0;0.3333;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="256">ML Pipelines &amp; SHAP
        <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.3333;1" dur="9s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="256">3D &amp; WebGL Experiences
        <animate attributeName="opacity" calcMode="discrete" values="0;0;1" keyTimes="0;0.6666;1" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>
    <!-- caret -->
    <rect x="288" y="240" width="3" height="21" fill="#22d3ee">
      <animate attributeName="opacity" values="1;1;0;0" calcMode="discrete" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- description -->
    <text x="60" y="296" font-size="14.5" fill="#9aa4b2" font-family="'Segoe UI',Helvetica,Arial,sans-serif">I build full-stack apps, ML pipelines and cinematic 3D web</text>
    <text x="60" y="318" font-size="14.5" fill="#9aa4b2" font-family="'Segoe UI',Helvetica,Arial,sans-serif">experiences — clean architecture, things that actually work.</text>

    <!-- CTA buttons -->
    <g>
      <rect x="60" y="342" width="176" height="46" rx="9" fill="url(#btnGrad)"/>
      <text x="148" y="371" text-anchor="middle" font-size="15" font-weight="600"
            fill="#ffffff" font-family="'Segoe UI',Helvetica,Arial,sans-serif">View Work  →</text>
    </g>
    <g>
      <rect x="252" y="342" width="156" height="46" rx="9" fill="none" stroke="#3d4657" stroke-width="1.6"/>
      <text x="330" y="371" text-anchor="middle" font-size="15" font-weight="500"
            fill="#c9d1d9" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Let's Talk</text>
    </g>

    <!-- ============ RIGHT · CODE CARD ============ -->
    <g filter="url(#cardShadow)">
      <rect x="530" y="96" width="400" height="212" rx="12" fill="#161b22" stroke="#2d3340" stroke-width="1.2"/>
      <path d="M530 108 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v26 h-400 z" fill="#1c212b"/>
      <line x1="530" y1="134" x2="930" y2="134" stroke="#2d3340"/>
      <!-- tab -->
      <rect x="538" y="100" width="116" height="30" rx="7" fill="#161b22"/>
      <circle cx="554" cy="115" r="4" fill="#3b82f6"/>
      <text x="566" y="119" font-size="12.5" fill="#e6edf3">hero.tsx</text>
      <text x="636" y="119" font-size="12" fill="#596375">✕</text>
      <rect x="538" y="127" width="116" height="2.5" fill="url(#topLine)"/>
      <text x="912" y="119" font-size="12" fill="#596375" text-anchor="end">TSX</text>

      <!-- code -->
      <g font-size="13">
        <g fill="#484f58" text-anchor="end">
          <text x="562" y="158">1</text><text x="562" y="180">2</text>
          <text x="562" y="202">3</text><text x="562" y="224">4</text>
          <text x="562" y="246">5</text><text x="562" y="268">6</text>
        </g>
        <text x="576" y="158"><tspan fill="#c678dd">const</tspan><tspan fill="#61afef"> saptarshi</tspan><tspan fill="#abb2bf"> = {</tspan></text>
        <text x="576" y="180"><tspan fill="#e06c75">  role</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">"Full-stack Developer"</tspan><tspan fill="#abb2bf">,</tspan></text>
        <text x="576" y="202"><tspan fill="#e06c75">  stack</tspan><tspan fill="#abb2bf">: [</tspan><tspan fill="#98c379">"TypeScript"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Rust"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Python"</tspan><tspan fill="#abb2bf">],</tspan></text>
        <text x="576" y="224"><tspan fill="#e06c75">  ships</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d19a66">true</tspan><tspan fill="#abb2bf">,  </tspan><tspan fill="#e06c75">coffee</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d19a66">Infinity</tspan><tspan fill="#abb2bf">,</tspan></text>
        <text x="576" y="246"><tspan fill="#e06c75">  status</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">"open to interesting work"</tspan></text>
        <text x="576" y="268" fill="#abb2bf">}</text>
      </g>
      <!-- card footer -->
      <line x1="530" y1="284" x2="930" y2="284" stroke="#2d3340"/>
      <text x="548" y="302" font-size="11.5" fill="#596375">Ln 6, Col 2</text>
      <text x="636" y="302" font-size="11.5" fill="#596375">UTF-8</text>
      <text x="706" y="302" font-size="11.5" fill="#596375">TypeScript</text>
      <text x="912" y="302" font-size="11.5" fill="#3fb950" text-anchor="end">✓ Prettier</text>
    </g>

    <!-- ============ TERMINAL CHIP ============ -->
    <g filter="url(#cardShadow)">
      <rect x="560" y="332" width="346" height="52" rx="10" fill="#0c1017" stroke="#2d3340" stroke-width="1.2"/>
      <rect x="560" y="332" width="346" height="3" fill="url(#topLine)"/>
      <circle cx="584" cy="360" r="4.5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="598" y="365" font-size="13"><tspan fill="#22d3ee">❯</tspan><tspan fill="#7ee787"> npm run dev</tspan><tspan fill="#6e7681">  ready in 412ms</tspan></text>
    </g>
  </g>

  <!-- outer hairline accent -->
  <rect x="14" y="14" width="952" height="2.5" fill="url(#topLine)" opacity="0.9" rx="1"/>
</svg>
