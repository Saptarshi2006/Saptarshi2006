<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2430"/>
      <stop offset="100%" stop-color="#171b26"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="win"><rect x="20" y="18" width="940" height="304" rx="12"/></clipPath>
  </defs>

  <!-- editor window -->
  <g filter="url(#shadow)">
    <rect x="20" y="18" width="940" height="304" rx="12" fill="url(#bg)" stroke="#2d3340" stroke-width="1.5"/>
  </g>

  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="20" y="18" width="940" height="42" fill="url(#bar)"/>
    <circle cx="52" cy="39" r="6.5" fill="#ff5f57"/>
    <circle cx="74" cy="39" r="6.5" fill="#febc2e"/>
    <circle cx="96" cy="39" r="6.5" fill="#28c840"/>
    <text x="490" y="44" text-anchor="middle" font-size="13" fill="#7d8590">saptarshi — profile.tsx</text>

    <!-- activity / line numbers -->
    <rect x="20" y="60" width="56" height="262" fill="#12161e"/>
    <g font-size="12.5" fill="#484f58" text-anchor="end">
      <text x="64" y="92">1</text><text x="64" y="118">2</text><text x="64" y="144">3</text>
      <text x="64" y="170">4</text><text x="64" y="196">5</text><text x="64" y="222">6</text>
      <text x="64" y="248">7</text><text x="64" y="274">8</text><text x="64" y="300">9</text>
    </g>
    <!-- active line highlight -->
    <rect x="76" y="152" width="884" height="26" fill="#7c3aed" opacity="0.10"/>

    <!-- code -->
    <g font-size="15.5">
      <text x="92" y="112"><tspan fill="#c678dd">export const</tspan><tspan fill="#61afef"> developer</tspan><tspan fill="#abb2bf"> = {</tspan></text>
      <text x="124" y="138"><tspan fill="#e06c75">  name</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">"Saptarshi Mukherjee"</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text x="124" y="164"><tspan fill="#e06c75">  role</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">"Full-stack · ML · 3D"</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text x="124" y="190"><tspan fill="#e06c75">  stack</tspan><tspan fill="#abb2bf">: [</tspan><tspan fill="#98c379">"TypeScript"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Rust"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Python"</tspan><tspan fill="#abb2bf">],</tspan></text>
      <text x="124" y="216"><tspan fill="#e06c75">  ships</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d19a66">true</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#e06c75">coffee</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#d19a66">Infinity</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text x="124" y="242"><tspan fill="#e06c75">  openTo</tspan><tspan fill="#abb2bf">: </tspan><tspan fill="#98c379">"interesting work"</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text x="92" y="268" fill="#abb2bf">}</text>
      <text x="92" y="300"><tspan fill="#5c6370">// $ </tspan><tspan fill="#22d3ee" filter="url(#glow)">npm run build --future</tspan><tspan fill="#7c3aed" opacity="1">▊</tspan></text>
    </g>
  </g>

  <!-- top accent line -->
  <rect x="20" y="18" width="940" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
