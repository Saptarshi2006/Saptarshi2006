<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 74" font-family="'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="8" width="980" height="1.6" fill="url(#line)"/>

  <g>
