      keep building · keep shipping
    </text>
    <text x="490" y="64" text-anchor="middle" font-size="11.5" fill="#484f58" letter-spacing="3.5">
      git push origin main — every damn day
    </text>
  </g>

  <g fill="#7c3aed">
    <circle cx="14" cy="9" r="2.6" opacity="0.9"/>
    <circle cx="966" cy="9" r="2.6" opacity="0.9" fill="#22d3ee"/>
  </g>
</svg>
